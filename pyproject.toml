[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revtriage"
version = "0.1.0"
description = "Offline reverse-engineering triage: capability graph, IOCs, explainable threat score and a STIX 2.1 bundle from a suspicious file. Nothing is uploaded, ever."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Eduard Arbona" }]
keywords = [
  "malware-analysis", "triage", "reverse-engineering", "dfir", "blue-team",
  "ioc", "stix", "mitre-attack", "offline", "deobfuscation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

# Zero runtime dependencies. Every parser, the deobfuscator, the STIX writer and even
# the Ed25519 licence verifier are implemented on the standard library alone. For a tool
# that people point at live malware, "nothing third-party to audit" is a security
# property, not a bragging point: the supply chain is exactly one project — this one.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/earbona23/revtriage"
Issues = "https://github.com/earbona23/revtriage/issues"

[project.scripts]
revtriage = "revtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
